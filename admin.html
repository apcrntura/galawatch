<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GalaWatch Admin</title><link rel="stylesheet" href="style.css"><script src="shared.js"></script></head>
<body class="adm">
<div class="topbar"><div class="brand"><div class="brand-title">GalaWatch Admin</div><div class="brand-sub" id="who"></div></div><a class="btn" href="index.html">View Dashboard</a><button id="out">Log out</button></div>
<div class="tabs"><button data-t="users" class="on">User Accounts</button><button data-t="dests">Destinations and Cameras</button><button data-t="thr">Overcrowding Threshold</button></div>
<div id="msg"></div><main id="main"></main>
<script>
const S=Auth.require(['admin']);
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=m=>{$('#msg').textContent=m};
$('#who').textContent=S.name+' ('+ROLES[S.role]+')';$('#out').onclick=()=>Auth.logout();
let tab='users';
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));msg('');show()});
const show=()=>({users:uView,dests:dView,thr:tView})[tab]();
function uView(){const us=Store.users();$('#main').innerHTML=`<h2>User Accounts</h2><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>${us.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${ROLES[u.role]}</td><td>${u.active?'Active':'Disabled'}</td><td><button onclick="uAct(${i},'t')">${u.active?'Disable':'Enable'}</button> <button onclick="uAct(${i},'p')">Reset password</button> <button onclick="uAct(${i},'d')">Delete</button></td></tr>`).join('')}</table>
<h3>Add user</h3><div class="row"><input id="nn" placeholder="Full name"><input id="nu" placeholder="Username"><select id="nr"><option value="tourism">Tourism Officer</option><option value="lgu">LGU Officer</option><option value="admin">System Admin</option></select><input id="np" type="password" placeholder="Password (min 8)"><button class="btn" onclick="uAdd()">Add user</button></div>`}
async function uAct(i,a){const us=Store.users(),u=us[i],me=u.username===S.username;
 if(a==='t'){if(me)return msg('You cannot disable your own account.');u.active=!u.active}
 if(a==='d'){if(me)return msg('You cannot delete your own account.');if(!confirm('Delete '+u.username+'?'))return;us.splice(i,1)}
 if(a==='p'){const p=prompt('New password for '+u.username+' (min 8 characters)');if(!p||p.length<8)return msg('Password not changed.');u.pw=await hash(p)}
 Store.set(K.u,us);uView();msg('Saved.')}
async function uAdd(){const us=Store.users(),n=$('#nn').value.trim(),u=$('#nu').value.trim().toLowerCase(),p=$('#np').value;
 if(!n||!u||p.length<8)return msg('Name, username and a password of 8+ characters are required.');
 if(us.some(x=>x.username===u))return msg('Username already exists.');
 us.push({username:u,name:n,role:$('#nr').value,active:true,pw:await hash(p)});Store.set(K.u,us);uView();msg('User added.')}
const F=[['name','Name'],['region','Region'],['lat','Latitude'],['lng','Longitude'],['cap','Load %'],['visitors','Visitors']];
const fields=(p,d)=>F.map(f=>`<label>${f[1]}<input id="${p}${f[0]}" value="${d?esc(d[f[0]]):''}"></label>`).join('');
function dView(){const ds=Store.destinations();$('#main').innerHTML='<h2>Destinations and Cameras</h2>'+ds.map((d,i)=>`<div class="card"><div class="row">${fields('f'+i,d)}<button class="btn" onclick="dSave(${i})">Save</button><button onclick="dDel(${i})">Delete</button></div>
<div class="cams">Cameras: ${d.cameras.map((c,j)=>`<span class="chip">${esc(c.name)} (${c.online?'online':'offline'}) <button onclick="cAct(${i},${j},'t')">Toggle</button> <button onclick="cAct(${i},${j},'d')">Remove</button></span>`).join('')||'None'}<input id="c${i}" placeholder="New camera name"><button onclick="cAdd(${i})">Add camera</button></div></div>`).join('')+`<h3>Add destination</h3><div class="row">${fields('n')}<button class="btn" onclick="dAdd()">Add destination</button></div>`}
function rd(p){const g=k=>$('#'+p+k).value.trim(),o={name:g('name'),region:g('region'),lat:+g('lat'),lng:+g('lng'),cap:+g('cap'),visitors:+g('visitors')};
 if(!o.name||!o.region||g('lat')===''||g('lng')===''||Math.abs(o.lat)>90||Math.abs(o.lng)>180||!(o.cap>=0&&o.cap<=100)||!(o.visitors>=0)){msg('Check the fields: name, region, valid coordinates, load 0-100, visitors 0 or more.');return null}return o}
function dSave(i){const o=rd('f'+i);if(!o)return;const ds=Store.destinations();Object.assign(ds[i],o);Store.set(K.d,ds);dView();msg('Destination saved.')}
function dDel(i){const ds=Store.destinations();if(!confirm('Delete '+ds[i].name+'?'))return;ds.splice(i,1);Store.set(K.d,ds);dView();msg('Deleted.')}
function dAdd(){const o=rd('n');if(!o)return;const ds=Store.destinations();ds.push({...o,id:'d'+Date.now(),trend:Array(7).fill(o.visitors),alert:'info',alertMsg:'Newly added destination. No notes yet.',cameras:[]});Store.set(K.d,ds);dView();msg('Destination added.')}
function cAdd(i){const n=$('#c'+i).value.trim();if(!n)return msg('Enter a camera name.');const ds=Store.destinations();ds[i].cameras.push({name:n,online:true});Store.set(K.d,ds);dView()}
function cAct(i,j,a){const ds=Store.destinations(),c=ds[i].cameras;a==='t'?c[j].online=!c[j].online:c.splice(j,1);Store.set(K.d,ds);dView()}
function tView(){const t=Store.thresholds();$('#main').innerHTML=`<h2>Overcrowding Threshold</h2><div class="card"><div class="row"><label>Medium starts at (%)<input id="tm" type="number" value="${t.med}"></label><label>High (overcrowding alert) above (%)<input id="th" type="number" value="${t.high}"></label><button class="btn" onclick="tSave()">Save thresholds</button></div></div>`}
function tSave(){const m=+$('#tm').value,h=+$('#th').value;if(!(m>0&&m<h&&h<=100))return msg('Medium must be above 0 and below High; High must be 100 or less.');Store.set(K.t,{med:m,high:h});msg('Thresholds saved. The dashboard uses them on next load.')}
show();
</script></body></html>
